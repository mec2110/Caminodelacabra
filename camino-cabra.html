<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goat Path</title>
<script>
  /* Modo claro por defecto, salvo que: (a) la persona ya eligió un modo antes con el
     toggle (se respeta siempre), o (b) no eligió nada todavía y su sistema/celular
     tiene el modo oscuro activado (se lo respeta también). Se aplica antes del
     primer pintado para evitar parpadeo. */
  (function(){
    try{
      var t = localStorage.getItem('camino-cabra-theme');
      if(t === 'light' || t === 'dark'){
        document.documentElement.setAttribute('data-theme', t);
      } else {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    }catch(e){
      document.documentElement.setAttribute('data-theme','light');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Modo oscuro por defecto: estos son los valores base. ── */
    /* ── Primarios ── */
    --primary: #2D0E9A;
    --primary-black: #f5f5f7;
    --primary-blue: #08B2FC;

    /* ── Neutrales ── */
    --neutral-white: #FFFFFF;
    --neutral-gray: #CCCCCC;

    /* ── Secundarios / Backgrounds ── */
    --bg-lavender: #211C3D;
    --bg-purple-light: #2A2350;
    --bg-blue-light: #123241;
    --bg-ghost-white: #121214;
    --bg-periwinkle: #262B4D;

    /* ── Estados: Success ── */
    --success-light: #DDFB70;
    --success: #3ABD23;

    /* ── Estados: Error ── */
    --error: #FF674A;
    --error-light: #FEA796;
    --error-dark: #C83317;

    /* ── Estados: Warning ── */
    --warning: #FFC445;
    --warning-light: #FCE8BB;
    --warning-dark: #9F7416;

    /* ── Estados: Info ── */
    --info: #7F8BD3;
    --info-dark: #B9B4E8;

    /* ── Semánticos: dependen del tema, resuelven contraste sin tocar --primary ── */
    --surface: #1C1C20;
    --primary-text: var(--primary-blue);

    /* ── Estructurales (no son parte del UI kit de color, se mantienen) ── */
    --shadow: 0px 6px 16px rgba(0,0,0,0.35);
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --radius-btn: 48px;
    color-scheme: dark;
  }
  /* Modo claro: se activa solo si el usuario lo elige explícitamente con el toggle. */
  :root[data-theme="light"]{
    --primary-black: #000000;
    --bg-lavender: #F4F1FA;
    --bg-purple-light: #EAE3FF;
    --bg-blue-light: #C7EEFF;
    --bg-ghost-white: #FCFAFF;
    --bg-periwinkle: #C2C9EE;
    --info-dark: #112387;
    --surface: #FFFFFF;
    --primary-text: var(--primary);
    --shadow: 0px 6px 16px rgba(38,35,53,0.05);
    color-scheme: light;
  }
  /* Escala tipográfica del sistema (Open Sans) */
  .h1{ font-size:32px; line-height:1.2; font-weight:600; }
  .h2{ font-size:28px; line-height:32px; font-weight:600; }
  .h3{ font-size:24px; line-height:28px; font-weight:600; }
  .h4{ font-size:18px; line-height:24px; font-weight:600; }
  .h5{ font-size:16px; line-height:20px; font-weight:600; }
  .h6{ font-size:14px; line-height:18px; font-weight:600; }
  .h7{ font-size:12px; line-height:16px; font-weight:600; }
  .body-reg1{ font-size:16px; line-height:22px; font-weight:400; }
  .body-reg2{ font-size:12px; line-height:16px; font-weight:400; }
  .body-reg3{ font-size:10px; line-height:14px; font-weight:400; }
  .body-reg4{ font-size:8px; line-height:11px; font-weight:400; }
  .body-med1{ font-size:16px; line-height:22px; font-weight:600; }
  .body-med2{ font-size:12px; line-height:16px; font-weight:600; }
  .body-med3{ font-size:10px; line-height:14px; font-weight:600; }
  .body-med4{ font-size:8px; line-height:11px; font-weight:600; }
</style>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg-ghost-white); font-family:'Open Sans',sans-serif; color:var(--primary-black);
    display:flex; align-items:center; justify-content:center; min-height:100%;
    padding: max(24px, env(safe-area-inset-top,0px)) 16px max(24px, env(safe-area-inset-bottom,0px));
  }
  h1,h2,h3,.display{font-family:'Open Sans',sans-serif; font-weight:600;}
  button{ font-family:inherit; }

  .phone{
    width:440px; max-width:100%; height:956px; max-height:96vh;
    background:var(--bg-ghost-white); border-radius:24px;
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }
  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    width:100%; height:44px; padding:0 24px; box-sizing:border-box;
    font-size:12px; font-weight:600; color:var(--primary-black); flex-shrink:0;
  }
  .topbar{ display:flex; justify-content:flex-end; align-items:center; width:100%; padding:12px 24px; flex-shrink:0; box-sizing:border-box; }
  .brand-name{ font-family:'Open Sans',sans-serif; }
  .logo{ font-family:'Open Sans',sans-serif; font-weight:600; font-size:22px; color:var(--primary-text); display:flex; align-items:center; gap:6px;}
  .badges{ display:flex; gap:8px; }
  .badge{ display:flex; align-items:center; gap:5px; font-weight:600; font-size:12px; padding:6px 12px; border-radius:20px; }
  .badge.streak{ background:var(--warning-light); color:var(--warning-dark); }
  .badge.coin{ background:var(--success-light); color:var(--success); }
  .badge.help{ background:var(--bg-purple-light); color:var(--primary-text); border:none; cursor:pointer; font-family:'Open Sans',sans-serif; }
  .badge.theme-toggle{ background:var(--bg-purple-light); color:var(--primary-text); border:none; cursor:pointer; font-family:'Open Sans',sans-serif; }

  /* Barra de progreso del día: persistente en Camino/Perfil/Tienda mientras hay un contrato activo,
     así siempre hay un vistazo rápido de cuánto falta sin tener que volver a la pantalla de Foco. */
  .day-progress{ display:none; flex-direction:column; gap:6px; padding:0 24px 14px; flex-shrink:0; }
  .day-progress-label{ display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--info-dark); }

  /* Contenedor de pantalla: cuerpo scrolleable + footer de acción SIEMPRE dentro del layout */
  .screen{ flex:1; display:flex; flex-direction:column; min-height:0; padding-bottom:84px; }
  .screen-body{ flex:1; min-height:0; overflow-y:auto; padding: 6px 22px 10px; -webkit-overflow-scrolling:touch; }
  .screen-body::-webkit-scrollbar{ display:none; }
  .screen-footer{ flex-shrink:0; padding: 10px 22px 2px; display:flex; flex-direction:column; gap:10px; }
  .bottom-section{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding-top:12px; width:100%; min-height:183px; box-sizing:border-box; }

  .progressbar{ height:10px; background:var(--bg-lavender); border-radius:20px; overflow:hidden; }
  .progressbar > div{ height:100%; background:var(--primary-text); border-radius:20px; transition:width .5s ease; }

  .hello{ display:flex; align-items:center; gap:14px; background:var(--surface); border-radius:var(--radius-lg); padding:16px; margin: 10px 0 22px;}
  .hello p{ margin:0; font-size:16px; line-height:22px; color:var(--primary-black); font-weight:400;}
  .hello strong{ font-family:'Open Sans',sans-serif; }

  .q-title{ font-size:24px; line-height:28px; font-weight:600; margin:6px 0 2px; }
  .q-sub{ color:var(--info-dark); font-size:16px; line-height:22px; font-weight:400; margin:0 0 16px; }

  .goal-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:none; border-radius:var(--radius-md); padding:12px 10px 12px 14px; margin-bottom:10px; }
  .goal-num{ width:26px; height:26px; border-radius:50%; background:var(--bg-purple-light); color:var(--primary-text); font-weight:600; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .goal-row input{ border:none; outline:none; background:transparent; font-family:'Open Sans',sans-serif; font-size:16px; font-weight:400; color:var(--primary-black); width:100%; }
  .goal-row input::placeholder{ color:var(--info-dark); font-weight:400; }
  .goal-del{ border:none; background:transparent; color:var(--info-dark); font-size:16px; cursor:pointer; width:22px; height:22px; flex-shrink:0; line-height:1; }
  .goal-del:hover{ color:var(--error-dark); }

  .add-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; color:var(--primary-text); font-size:16px; font-weight:600; cursor:pointer; background:none; border:none; width:100%; text-align:left; }
  .add-row .goal-num{ background:transparent; border:1.5px dashed var(--primary-text); color:var(--primary-text); }
  .empty-hint{ text-align:center; color:var(--info-dark); font-size:12px; padding:18px 10px; }

  .btn{
    display:block; width:100%; text-align:center; border:none; cursor:pointer;
    font-family:'Open Sans',sans-serif; font-weight:600; font-size:16px;
    padding:16px; border-radius:var(--radius-btn); color:#fff; transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ background:var(--primary); }
  .btn-success{ background:var(--success); }
  .btn-primary-cta{ background:var(--success); }
  .btn-outline{ background:var(--bg-purple-light); color:var(--primary-text); }
  .btn-tertiary{ background:none; color:var(--primary-text); font-weight:600; font-size:16px; padding:10px; }
  .btn-ghost{ background:none; color:var(--info-dark); font-weight:600; font-size:12px; padding:8px; }

  .content{ display:flex; flex-direction:column; gap:32px; padding:16px 24px 0 24px; width:100%; box-sizing:border-box; }
  .progress-section{ display:flex; flex-direction:column; gap:8px; width:100%; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--info-dark); }
  .focus-label{ font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--primary-text); background:var(--bg-purple-light); padding:5px 12px; border-radius:20px; margin:0;}
  .focus-task{ font-size:28px; line-height:32px; font-weight:600; margin:0; }
  .focus-hint{ color:var(--info-dark); font-size:16px; line-height:22px; font-weight:400; margin:0; }
  .focal-card{ display:flex; flex-direction:column; align-items:center; gap:24px; padding:32px; width:100%; background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow); box-sizing:border-box; text-align:center; }


  .celeb-wrap{ display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:20px; }
  .celeb-ring{ position:relative; width:220px; height:220px; border-radius:50%; background: var(--bg-purple-light); display:flex; align-items:center; justify-content:center; margin: 8px 0 18px; }
  .celeb-goat{ animation: jump 1s ease-in-out infinite; }
  @keyframes jump{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-14px) rotate(-6deg);} }
  .xp-float{ position:absolute; top:10px; right:6px; background:var(--error-light); color:#fff; font-weight:700; font-family:'Open Sans',sans-serif; font-size:12px; padding:6px 12px; border-radius:20px; box-shadow:var(--shadow); animation: floatup 1.6s ease-out infinite; }
  @keyframes floatup{ 0%{ transform:translateY(0); opacity:1;} 100%{ transform:translateY(-30px); opacity:0;} }
  .confetti{ position:absolute; inset:0; overflow:visible; pointer-events:none; }
  .confetti span{ position:absolute; top:40%; left:50%; width:8px; height:8px; border-radius:2px; opacity:0; }
  .celeb-title{ font-size:28px; line-height:32px; font-weight:600; margin: 4px 0 4px; }
  .celeb-sub{ color:var(--info-dark); font-size:16px; line-height:22px; font-weight:400; margin:0; }

  .summary-title{ text-align:center; font-size:24px; line-height:28px; font-weight:600; margin:0 0 4px; }
  .summary-sub{ text-align:center; color:var(--info-dark); font-size:16px; line-height:22px; font-weight:400; margin:0 0 22px; }
  .streak-card{ display:flex; align-items:center; gap:12px; background:var(--warning-light); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:14px; }
  .streak-card .n{ font-size:16px; font-weight:600; color:var(--warning-dark); font-family:'Open Sans',sans-serif;}
  .streak-card .s{ font-size:12px; color:var(--warning-dark); opacity:.85; }
  .level-card{  gap:12px; background:var(--surface); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:14px;}
  .level-card .row{ display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--primary-black); margin-bottom:8px;}
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px; }
  .stat-box{ border-radius:var(--radius-md); padding:14px; }
  .stat-box.blue{ background:var(--bg-blue-light); }
  .stat-box.purple{ background:var(--bg-purple-light); }
  .stat-box .k{ font-size:12px; font-weight:600; letter-spacing:.03em; color:var(--primary-text); margin-bottom:6px;}
  .stat-box .v{ font-size:18px; line-height:24px; font-weight:700; font-family:'Open Sans',sans-serif;}

  .profile-hero{ text-align:center; padding: 24px; border-radius: 24px; background-color: var(--surface); margin-bottom: 24px ;}
  .profile-name{ font-size:24px; line-height:28px; font-weight:600; margin:0; }
  .profile-level{ color:var(--info-dark); font-size:12px; margin: 2px 0 18px; }
  .xp-row{ display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--info-dark); margin-bottom:6px; }
  .section-title{ font-size:14px; line-height:18px; font-weight:700; margin: 22px 0 10px; display:flex; justify-content:space-between; align-items:center;}
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--success-light); color:var(--success); font-size:12px; font-weight:600; padding:7px 12px; border-radius:20px; }
  .chip-close{ border:none; background:transparent; color:var(--success); font-size:12px; font-weight:700; cursor:pointer; padding:0; line-height:1; }
  .empty-note{ display:flex; align-items:flex-start; gap:8px; background:var(--bg-blue-light); color:var(--info-dark); font-size:12px; line-height:16px; font-weight:400; padding:12px 14px; border-radius:var(--radius-md); }
  .evo-row{ display:flex; align-items:center; gap:12px; padding:12px; border-radius:var(--radius-md); background:var(--bg-lavender); margin-bottom:8px;}
  .evo-row.active{ background:var(--bg-purple-light); }
  .evo-row .t{ font-weight:700; font-size:14px; line-height:18px; }
  .evo-row .s{ font-size:12px; color:var(--info-dark); }
  .evo-tag{ margin-left:auto; background:var(--primary); color:var(--neutral-white); font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px;}

  .shop-title{ font-size:18px; line-height:24px; font-weight:600; margin: 6px 0 2px;}
  .shop-sub{ color:var(--info-dark); font-size:16px; line-height:22px; font-weight:400; margin:0 0 18px;}
  .shop-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .shop-item{ background:var(--surface); border:1.5px solid var(--bg-purple-light); border-radius:var(--radius-md); padding:12px; cursor:pointer; transition:border-color .15s; }
  .shop-item.owned{ border-color:var(--success); }
  .shop-icon{ width:100%; height:68px; display:flex; align-items:center; justify-content:center; font-size:30px; background:var(--bg-purple-light); border-radius:var(--radius-sm); margin-bottom:10px;}
  .shop-name{ font-size:14px; line-height:18px; font-weight:700; margin:0 0 6px; }
  .shop-price{ display:flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:var(--success); }
  .shop-owned-tag{ font-size:12px; font-weight:700; color:var(--success); }

  .bottomnav{ flex-shrink:0; background:var(--surface); border-top:1px solid var(--bg-lavender); display:flex; align-items:center; min-height:72px; padding: 0 32px calc(env(safe-area-inset-bottom,0px)); position:absolute; left:0; right:0; bottom:0; }
  .navitem{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:6px 0; color:var(--info-dark); font-size:12px; font-weight:600; }
  .navitem.active{ color:var(--primary-blue); }
  .navitem svg{ width:22px; height:22px; }

  .toast-overlay{ position:absolute; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:19; }
  .toast-overlay.show{ opacity:1; }
  .toast{ position:absolute; left:50%; top:54px; max-width: calc(100% - 44px); background:var(--neutral-white); border:1px solid var(--primary-blue); color:var(--primary-blue); padding:10px 16px; border-radius:8px; font-size:14px; line-height:18px; font-weight:600; text-align:center; box-shadow:var(--shadow); opacity:0; transform:translate(-50%, -6px); transition:all .25s ease; pointer-events:none; z-index:20;}
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .confirm-overlay{ position:absolute; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:29; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .confirm-overlay.show{ opacity:1; pointer-events:auto; }
  .confirm-card{ background:var(--surface); border-radius:var(--radius-lg); padding:24px; width:100%; max-width:340px; box-shadow:var(--shadow); box-sizing:border-box; text-align:center; transform:translateY(6px); transition:transform .2s ease; }
  .confirm-overlay.show .confirm-card{ transform:translateY(0); }
  .confirm-title{ font-size:16px; line-height:20px; font-weight:600; color:var(--primary-black); margin:0 0 8px; }
  .confirm-text{ font-size:14px; line-height:20px; color:var(--info-dark); margin:0 0 20px; }
  .confirm-buttons{ display:flex; flex-direction:column; gap:10px; }
  .btn-danger{ background:var(--error-dark); color:#fff; }

  /* Onboarding */
  .onb-screen{ height:100%; display:flex; flex-direction:column; }
  /* ========== ONBOARDING SCREENS (bloque provisto, escopeado en .screen-onboarding
     para no colisionar con el .focal-card ya usado en Login/Foco) ========== */
  .screen-onboarding{ display:flex; flex-direction:column; width:100%; font-family:'Open Sans', sans-serif; }
  .onboarding-content{ padding:8px 24px 0 24px; flex:1; }
  .screen-onboarding .focal-card{ background-color:var(--surface); border-radius:28px; padding:24px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .focal-card .eyebrow{ font-weight:600; font-size:18px; color:var(--info-dark); margin:0; text-align:center; }
  .focal-card .main-task{ font-weight:600; font-size:14px; color:var(--primary-black); margin:0; text-align:center; width:100%; }
  .onboarding-illustration{ width:283px; max-width:100%; height:250px; display:flex; align-items:center; justify-content:center; }
  .onboarding-illustration svg{ width:100%; height:100%; }
  .focal-card .supportive-body{ font-weight:400; font-size:12px; color:var(--primary-black); margin:0; text-align:center; line-height:1.35; }
  .pagination-dots{ display:flex; align-items:center; justify-content:center; gap:8px; padding:6px 0; }
  .pagination-dots .dot{ width:8px; height:8px; border-radius:4px; background-color:var(--neutral-gray); }
  .pagination-dots .dot.active{ width:16px; height:8px; border-radius:4px; background-color:var(--primary-text); }
  .onboarding-buttons{ display:flex; flex-direction:column; gap:16px; padding:24px; }
  .onboarding-buttons .btn-primary{ width:100%; height:54px; background-color:var(--primary); color:var(--neutral-white); border:none; border-radius:48px; font-family:'Open Sans', sans-serif; font-weight:600; font-size:16px; cursor:pointer; transition:opacity .2s ease; }
  .onboarding-buttons .btn-primary:hover{ opacity:.9; }
  .onboarding-buttons .btn-secondary{ width:100%; height:54px; background-color:var(--surface); color:var(--primary-text); border:1px solid var(--primary-text); border-radius:48px; font-family:'Open Sans', sans-serif; font-weight:600; font-size:16px; cursor:pointer; transition:opacity .2s ease; }
  .onboarding-buttons .btn-secondary:hover{ opacity:.85; }
  .btn-secondary:active{ transform:scale(.97); }
  .login-title{ font-size:16px; line-height:20px; font-weight:600; color:var(--primary-black); margin:0 0 24px; width:100%; }
  .login-title-accent{ color:var(--primary-text); }
  .field-group{ text-align:left; margin-bottom:16px; width:100%; }
  .field-label{ display:block; font-size:12px; font-weight:400; color:var(--primary-black); margin-bottom:4px; }
  .field-input{ width:100%; box-sizing:border-box; height:54px; border: solid 1px var(--primary-text); border-radius:8px; padding:16px; font-family:'Open Sans',sans-serif; font-size:16px; color:var(--primary-black); background:var(--surface); }
  .field-input::placeholder{ color:var(--neutral-gray); }
  .field-input:focus{ outline:none; box-shadow:0 0 0 2px var(--primary-text); }
  .btn-tertiary-link{ background:none; border:none; color:var(--info-dark); font-family:'Open Sans',sans-serif; font-size:14px; font-weight:600; margin-top:6px; cursor:pointer; padding:8px; text-decoration:none; }
  .btn-tertiary-link:hover{ text-decoration:underline; }
  .btn-tertiary-link strong{ font-weight:700; }
</style>
</head>
<body>

const defaultState = {

};
let state = load();
function load(){
  try{
    const raw = localStorage.getItem('camino-cabra-state-v2');
    if(raw) return Object.assign({}, defaultState, JSON.parse(raw));
  }catch(e){}
  return JSON.parse(JSON.stringify(defaultState));
}
function save(){ try{ localStorage.setItem('camino-cabra-state-v2', JSON.stringify(state)); }catch(e){} }

/* ---------- Racha: fecha real y Seguro de Racha ---------- */
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysBetween(dateStrA, dateStrB){
  const a = new Date(dateStrA+'T00:00:00');
  const b = new Date(dateStrB+'T00:00:00');
  return Math.round((b - a) / 86400000);
}
// Se corre una sola vez al abrir la app: si pasó al menos un día completo sin
// cerrar ningún contrato, la racha está en riesgo. Si hay un Seguro de Racha
// disponible, se consume solo y protege el fuego; si no, la racha se reinicia.
function checkStreakRollover(){
  if(!state.lastCompletionDate || state.streak === 0) return null;
  const gap = daysBetween(state.lastCompletionDate, todayStr());
  if(gap < 2) return null;
  if(state.streakShields > 0){
    state.streakShields -= 1;
    state.lastCompletionDate = todayStr();
    return 'shielded';
  }
  state.streak = 0;
  return 'lost';
}

function positionToast(){
  const t = document.getElementById('toast');
  const statusbar = document.querySelector('.statusbar');
  const topbar = document.getElementById('topbar');
  let topOffset = 10;
  if(statusbar) topOffset += statusbar.offsetHeight;
  if(topbar && getComputedStyle(topbar).display !== 'none') topOffset += topbar.offsetHeight;
  t.style.top = topOffset + 'px';
}
function toast(msg){
  const t = document.getElementById('toast');
  const overlay = document.getElementById('toastOverlay');
  positionToast();
  t.textContent = msg; t.classList.add('show');
  if(overlay) overlay.classList.add('show');
  setTimeout(()=>{ t.classList.remove('show'); if(overlay) overlay.classList.remove('show'); }, 1700);
}

function goTab(tab){
  state.tab = tab;
  if(tab==='camino' && state.dayDone) state.camino='summary';
  else if(tab==='camino' && state.camino==='celebration') state.camino='focus';
  render();
}

/* ---------- Render principal ---------- */
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('camino-cabra-theme', next); }catch(e){}
  syncThemeIcon();
}
function syncThemeIcon(){
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = document.documentElement.getAttribute('data-theme')==='light' ? '☀️' : '🌙';
}

function render(){
  syncThemeIcon();
  const topbar = document.getElementById('topbar');
  const bottomnav = document.getElementById('bottomnav');

  if(!state.loggedIn){
    topbar.style.display='none';
    bottomnav.style.display='none';
    document.getElementById('screen').style.paddingBottom='0';
    const isSlide = state.authStep >= 1;
    document.getElementById('screenBody').style.padding = isSlide ? '0' : '';
    document.getElementById('screenFooter').style.padding = isSlide ? '0' : '';
    const {body, footer} = renderOnboarding();
    document.getElementById('screenBody').innerHTML = body;
    document.getElementById('screenFooter').innerHTML = footer;
    positionToast();
    save();
    return;
  }

  document.getElementById('screenBody').style.padding = '';
  document.getElementById('screenFooter').style.padding = '';
  topbar.style.display='flex';
  bottomnav.style.display='flex';
  document.getElementById('screen').style.paddingBottom='84px';
  positionToast();

  document.getElementById('streakVal').textContent = state.streak;
  document.getElementById('coinVal').textContent = state.coins;
  document.querySelectorAll('.navitem').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab===state.tab);
  });

  // Barra de progreso del día: visible en cualquier pestaña mientras haya un
  // contrato activo, para no perder de vista cuánto falta aunque no estés en Foco.
  const dayProgress = document.getElementById('dayProgress');
  const hasActiveDay = state.goals.length > 0 && state.camino !== 'contract' && !state.dayDone;
  if(hasActiveDay){
    const total = state.goals.length;
    let done = state.goalIndex;
    if(state.camino === 'celebration') done = Math.min(state.goalIndex + 1, total);
    dayProgress.style.display = 'flex';
    document.getElementById('dayProgressText').textContent = `${done}/${total}`;
    document.getElementById('dayProgressFill').style.width = (done/total*100) + '%';
  } else {
    dayProgress.style.display = 'none';
  }

  let view;
  if(state.tab==='camino') view = renderCamino();
  else if(state.tab==='perfil') view = renderPerfil();
  else if(state.tab==='ayuda') view = renderAyuda();
  else view = renderTienda();

  document.getElementById('screenBody').innerHTML = view.body;
  document.getElementById('screenFooter').innerHTML = view.footer || '';
  document.getElementById('screenBody').scrollTop = 0;
  save();
}

function renderOnboarding(){
  if(state.authStep === 0){
    return {
      body: `
        <div class="content" style="padding-top:16px;">
          <div class="focal-card">
            <h5 class="login-title"><span class="login-title-accent">GOAT PATH</span>, un paso a la vez.</h5>
            ${goatImg({size:160})}
            <div class="field-group">
              <label class="field-label">Usuario</label>
              <input class="field-input" id="loginUser" type="text" placeholder="Ingresá tu nombre de usuario" />
            </div>
            <div class="field-group">
              <label class="field-label">Contraseña</label>
              <input class="field-input" id="loginPass" type="password" placeholder="Ingresá tu contraseña" />
            </div>
            <button class="btn-tertiary-link" onclick="registerSubmit()">¿Sos nuevo? Registrate acá</button>
          </div>
        </div>`,
      footer: `<button class="btn btn-primary" onclick="loginSubmit()">Ingresar</button>`
    };
  }
  const slide = INTRO_SLIDES[state.authStep-1];
  const isLast = state.authStep === INTRO_SLIDES.length;
  return {
    body: `
      <div class="screen-onboarding">
        <div class="onboarding-content">
          <div class="focal-card">
            <p class="eyebrow">${slide.title}</p>
            <p class="main-task">${slide.sub}</p>
            <div class="onboarding-illustration">${slide.svg}</div>
            <p class="supportive-body">${slide.text}</p>
          </div>
        </div>
      </div>`,
    footer: `
      <div class="pagination-dots">${INTRO_SLIDES.map((_,i)=>`<div class="dot ${i===state.authStep-1?'active':''}"></div>`).join('')}</div>
      <div class="onboarding-buttons">
        <button class="btn-primary" onclick="${isLast? 'finishOnboarding()' : 'nextIntro()'}">${isLast? 'Empezar' : 'Siguiente'}</button>
        <button class="btn-secondary" onclick="finishOnboarding()">Omitir</button>
      </div>
    `
  };
}
function displayName(){
  return (state.userName || '').trim() || 'Will';
}
function readTypedName(){
  // El campo "Usuario" no valida contra nada (no hay backend real todavía),
  // pero sí define cómo te saluda la app: si escribiste algo, lo usamos;
  // si lo dejás vacío, mantenemos el último nombre guardado (o "Will" por defecto).
  const typed = (document.getElementById('loginUser').value || '').trim();
  if(typed) state.userName = typed;
}
function loginSubmit(){
  // "Ingresar" es para cuentas que ya existen: nunca muestra la introducción,
  // esa vive únicamente detrás de "Registrate acá".
  readTypedName();
  state.onboarded = true;
  state.loggedIn = true;
  state.authStep = 0;
  state.tab = 'camino';
  render();
  toast('Sesión iniciada');
}
function registerSubmit(){
  // Único camino que dispara las slides de introducción, como corresponde
  // a un alta nueva.
  readTypedName();
  state.authStep = 1;
  render();
}
function nextIntro(){ state.authStep++; render(); }
function skipOnboarding(){ finishOnboarding(); }
function finishOnboarding(){
  state.onboarded = true;
  state.loggedIn = true;
  state.authStep = 0;
  state.tab = 'camino';
  state.camino = 'contract';
  render();
}
function logout(){
  // Cerrar sesión no es "borrar la cuenta": el onboarding, la racha, las monedas,
  // el nivel y los accesorios comprados/equipados se mantienen. Solo se corta
  // la sesión activa y el contrato del día en curso.
  state = Object.assign({}, defaultState, {
    onboarded: state.onboarded,
    streak: state.streak,
    coins: state.coins,
    xp: state.xp,
    xpNeeded: state.xpNeeded,
    level: state.level,
    owned: state.owned,
    equipped: state.equipped,
    streakShields: state.streakShields,
    lastCompletionDate: state.lastCompletionDate,
    userName: state.userName,
  });
  render();
  toast('Sesión cerrada');
}

/* ---------- Camino (contrato / foco / celebración / resumen) ---------- */
function renderCamino(){
  if(state.dayDone) state.camino='summary';
  if(state.camino==='contract') return renderContract();
  if(state.camino==='focus') return renderFocus();
  if(state.camino==='celebration') return renderCelebration();
  return renderSummary();
}

function renderContract(){
  const rows = state.goals.map((g,i)=>`
      <div class="goal-row">
        <div class="goal-num">${i+1}</div>
        <input value="${(g||'').replace(/"/g,'&quot;')}" placeholder="Ingresar tarea" oninput="state.goals[${i}]=this.value; updateStartBtn();" />
        <button class="goal-del" onclick="removeGoal(${i})" aria-label="Quitar">✕</button>
      </div>`).join('');

  const body = `
    <div class="hello">
      ${goatImg({size:56, src:goatForEquipped()})}
      <p><strong>¡Hola ${displayName()}!</strong><br>¿Todo listo para las cumbres de hoy? Hagamos un nuevo contrato.</p>
    </div>
    <h2 class="q-title" style="margin-bottom:24px;">¿Qué montañas escalamos hoy?</h2>
    <p class="q-sub" style="margin-bottom:24px;">Elegí hasta 5 objetivos diarios para que cumpla tu cabrita hoy.</p>
    ${rows}
    ${state.goals.length===0 ? '<p class="empty-hint">Todavía no cargaste ninguna cumbre.</p>' : ''}
    ${state.goals.length < 5 ? `<button class="add-row" onclick="addGoal()"><div class="goal-num">+</div>Añadir otra tarea (hasta 5 cumbres)</button>` : ''}
  `;
  const hasText = state.goals.some(g=>(g||'').trim().length>0);
  const footer = `
    <button class="btn btn-primary" id="startDayBtn" onclick="startDay()" ${hasText?'':'disabled'}>¡Vamos!</button>
    <button class="btn-tertiary-link" onclick="logout()">Cerrar sesión</button>
  `;
  return {body, footer};
}
function updateStartBtn(){
  const btn = document.getElementById('startDayBtn');
  if(!btn) return;
  const hasText = state.goals.some(g=>(g||'').trim().length>0);
  btn.disabled = !hasText;
}
function addGoal(){
  if(state.goals.length>=5){ toast('Máximo 5 cumbres por día'); return; }
  state.goals.push('');
  render();
  const inputs = document.querySelectorAll('.goal-row input');
  if(inputs.length) inputs[inputs.length-1].focus();
}
function removeGoal(i){
  state.goals.splice(i,1);
  render();
}
function startDay(){
  const clean = state.goals.map(g=>(g||'').trim()).filter(Boolean);
  if(clean.length===0){ toast('Cargá al menos una cumbre para arrancar'); return; }
  state.goals = clean;
  state.goalIndex = 0;
  state.skipStreak = 0;
  state.camino = 'focus';
  render();
}

function renderFocus(){
  const task = state.goals[state.goalIndex] || 'Cumbre';
  const done = state.goalIndex;
  const total = state.goals.length;
  const remaining = total - done;
  // Si ya dimos toda la vuelta a las cumbres pendientes sin completar ninguna,
  // saltear de nuevo sería un loop infinito: ofrecemos salir en vez de saltear.
  const canSkip = remaining > 1 && state.skipStreak < remaining;
  const body = `
    <div class="content">
      <div class="progress-section">
        <div class="progress-label"><span>Cumbre ${done+1} de ${total}</span><span>${Math.round(done/total*100)}% completado</span></div>
        <div class="progressbar"><div style="width:${done/total*100}%"></div></div>
      </div>
      <div class="focal-card">
        <div class="focus-label">ESTÁS ESCALANDO</div>
        ${goatImg({size:150, src:GOAT_WAITING})}
        <h2 class="focus-task">${task}</h2>
        <p class="focus-hint">Tu cabrita te anima a dar este paso. Un solo foco, nada más.</p>
      </div>
    </div>
  `;
  const footer = `
    <div class="bottom-section">
      <button class="btn btn-primary-cta" onclick="completeGoal()">Completado</button>
      ${canSkip
        ? `<button class="btn btn-tertiary" onclick="skipGoal()">Saltear</button>`
        : `<button class="btn btn-tertiary" onclick="endDayEarly()">Salir sin completar</button>`}
    </div>
  `;
  return {body, footer};
}

function skipGoal(){
  const g = state.goals.splice(state.goalIndex, 1)[0];
  state.goals.push(g);
  state.skipStreak += 1;
  render();
  toast('La dejamos para después. ¡Seguimos con la próxima cumbre! 🐐');
}

function completeGoal(){
  state.xp += 50;
  state.coins += 20;
  state.skipStreak = 0;
  if(state.xp >= state.xpNeeded){ state.xp -= state.xpNeeded; state.level++; }
  state.camino = 'celebration';
  render();
  spawnConfetti();
}

function renderCelebration(){
  const done = state.goalIndex+1;
  const total = state.goals.length;
  const isLast = done>=total;
  const body = `
    <div class="celeb-wrap">
      <div class="celeb-ring" id="celebRing">
        ${goatImg({size:150, src:GOAT_CELEBRATE, cls:'celeb-goat'})}
        <div class="xp-float">+50 XP</div>
        <div class="confetti" id="confettiWrap"></div>
      </div>
      <h2 class="celeb-title">¡Genial!</h2>
      <p class="celeb-sub">${state.goals[state.goalIndex]} completado con éxito</p>
    </div>
  `;
  const footer = `<button class="btn btn-primary" onclick="${isLast?'finishDay()':'nextGoal()'}">${isLast? 'Cerrar el día' : 'Sigamos avanzando'}</button>`;
  return {body, footer};
}
function nextGoal(){ state.goalIndex++; state.camino='focus'; render(); }
function finishDay(){ state.dayDone = true; state.daySuccess = true; state.streak += 1; state.lastCompletionDate = todayStr(); state.camino='summary'; render(); }

function renderSummary(){
  const total = state.goals.length;
  const success = !!state.daySuccess;
  const completed = success ? total : state.goalIndex;
  const goat = success ? GOAT_SUMMIT : GOAT_SAD;
  const title = success ? '¡Montaña escalada!' : '¡Oh no!';
  const sub = success ? 'Completaste todos tus objetivos hoy.' : 'No completaste todos tus objetivos hoy.';
  const btnLabel = success ? 'Cerrar el día' : 'Vuelve a intentarlo mañana';
  const body = `
    <div style="text-align:center;">${goatImg({size:190, src:goat})}</div>
    <h2 class="summary-title">${title}</h2>
    <p class="summary-sub">${sub}</p>
    <div class="streak-card">
      🔥
      <div><div class="n">${state.streak} Días seguidos</div><div class="s">¡Mantenés el fuego de la cabra encendido!</div></div>
    </div>
    <div class="level-card">
      <div class="row"><span>Nivel ${state.level} — ${stageName(state.level)}</span><span>${Math.round(state.xp/state.xpNeeded*100)}% para evolucionar</span></div>
      <div class="progressbar"><div style="width:${state.xp/state.xpNeeded*100}%"></div></div>
    </div>
    <div class="stat-grid">
      <div class="stat-box blue"><div class="k">CUMBRES</div><div class="v">${completed}/${total}</div></div>
      <div class="stat-box purple"><div class="k">EXPERIENCIA</div><div class="v">+${completed*50} XP</div></div>
    </div>
  `;
  const footer = `<button class="btn btn-primary" onclick="resetDay()">${btnLabel}</button>`;
  return {body, footer};
}
function endDayEarly(){
  state.dayDone = true;
  state.daySuccess = false;
  state.camino = 'summary';
  render();
}
function resetDay(){
  state.dayDone=false;
  state.goals=['','',''];
  state.camino='contract';
  render();
  toast('¡Nuevo contrato listo para mañana!');
}

/* ---------- Perfil ---------- */
function goatForEquipped(){
  const has = id => state.equipped.includes(id);
  if(has('blanca')) return GOAT_BLANCA;
  if(has('cap') && has('scarf')) return GOAT_CAP_SCARF;
  if(has('scarf')) return GOAT_SCARF;
  if(has('cap')) return GOAT_CAP;
  if(has('glasses')) return GOAT_GLASSES2;
  if(has('backpack')) return GOAT_BACKPACK;
  if(has('skate')) return GOAT_SKATE;
  return GOAT_CABRA;
}
function stageName(level){
  return level<=5 ? 'Cabrito Bebé' : (level<=15 ? 'Cabra Exploradora' : 'Cabra Sabia');
}
// Copy neutro respecto del género de la persona: usamos "la cabra" (siempre
// femenino en español, como sustantivo) en vez de adivinar el/la a partir
// del nombre, algo que fallaba con nombres como "Vale".
function profileTitle(level){
  if(level<=5) return 'la cabra bebé';
  if(level<=15) return 'la cabra exploradora';
  return 'la cabra sabia';
}
function renderPerfil(){
  const stage = stageName(state.level);
  const body = `
    <div class="profile-hero">
      ${goatImg({size:170, src:goatForEquipped()})}
      <h2 class="profile-name">${displayName()}, ${profileTitle(state.level)}</h2>
      <p class="profile-level">Nivel ${state.level} — ${stage}</p>
      <div class="xp-row"><span>${state.xp} / ${state.xpNeeded} XP</span><span>Siguiente nivel: ${state.xpNeeded-state.xp} XP</span></div>
      <div class="progressbar"><div style="width:${state.xp/state.xpNeeded*100}%"></div></div>
      <p class="profile-level" style="margin:10px 0 0;">🛡️ ${state.streakShields} Seguro${state.streakShields===1?'':'s'} de Racha disponible${state.streakShields===1?'':'s'}</p>
    </div>

    <div class="section-title">Accesorios equipados</div>
    ${state.equipped.length ? `<div class="chip-row">${state.equipped.map(id=>{
        const it = SHOP.find(s=>s.id===id);
        return `<div class="chip">⊙ ${it? it.name : id}<button class="chip-close" onclick="unequipItem('${id}')" aria-label="Quitar accesorio">✕</button></div>`;
      }).join('')}</div>` : `<div class="empty-note">ⓘ Todavía no tenés accesorios equipados. Cumplí objetivos, sumá puntos y equipá uno desde la tienda.</div>`}

    <div class="section-title">Línea de evolución</div>
    <div class="evo-row ${state.level<=5?'active':''}"><div><div class="t">Cabrito Bebé</div><div class="s">Nivel 1–5</div></div>${state.level<=5?'<div class="evo-tag">Actual</div>':''}</div>
    <div class="evo-row ${state.level>5&&state.level<=15?'active':''}"><div><div class="t">Cabra Exploradora</div><div class="s">Nivel 6–15</div></div>${state.level>5&&state.level<=15?'<div class="evo-tag">Actual</div>':''}</div>
    <div class="evo-row ${state.level>15?'active':''}"><div><div class="t">Cabra Sabia</div><div class="s">Nivel 16+</div></div>${state.level>15?'<div class="evo-tag">Actual</div>':''}</div>

    <div class="section-title">Datos de la app</div>
    <button class="btn-tertiary-link" style="color:var(--error-dark);" onclick="openResetConfirm()">Reiniciar progreso</button>
  `;
  return {body, footer:''};
}

function openResetConfirm(){
  document.getElementById('confirmOverlay').classList.add('show');
}
function closeResetConfirm(){
  document.getElementById('confirmOverlay').classList.remove('show');
}
function confirmReset(){
  closeResetConfirm();
  try{ localStorage.removeItem('camino-cabra-state-v2'); }catch(e){}
  state = Object.assign({}, defaultState);
  render();
  toast('Progreso reiniciado. ¡Arrancamos de cero! 🐐');
}

/* ---------- Ayuda / FAQs (misma info de la presentación inicial, siempre disponible) ---------- */
function renderAyuda(){
  const body = `
    <h2 class="q-title" style="margin-top:10px;">Cómo funciona Goat Path</h2>
    <p class="q-sub">Un repaso rápido, disponible cuando lo necesites.</p>
    ${INTRO_SLIDES.map(s=>`
      <div class="stat-box" style="margin-bottom:12px;">
        <div class="k" style="margin-bottom:8px;">${s.title.toUpperCase()}</div>
        <p style="margin:0; font-size:16px; line-height:22px; color:var(--info-dark); font-weight:400;">${s.text}</p>
      </div>`).join('')}
    <div class="section-title">Preguntas frecuentes</div>
    <div class="stat-box" style="margin-bottom:12px;">
      <div class="k" style="margin-bottom:6px;">¿Qué pasa si un día no completo nada?</div>
      <p style="margin:0; font-size:16px; line-height:22px; color:var(--info-dark); font-weight:400;">Comprá un Seguro de Racha en la Tienda con tus Brotes de Alfalfa. Si un día no llegás a cumplir tus cumbres, se usa solo y protege tu fuego — así un mal día no borra todo lo que veniste construyendo.</p>
    </div>
    <div class="stat-box" style="margin-bottom:12px;">
      <div class="k" style="margin-bottom:6px;">¿Cuántas cumbres puedo cargar por día?</div>
      <p style="margin:0; font-size:16px; line-height:22px; color:var(--info-dark); font-weight:400;">Entre 1 y 5, para evitar sobrecargarte.</p>
    </div>
  `;
  const footer = `<button class="btn btn-outline" onclick="state.tab='perfil'; render();">Volver</button>`;
  return {body, footer};
}

/* ---------- Tienda ---------- */
function renderTienda(){
  const body = `
    <h2 class="shop-title">Tienda de Alfalfa</h2>
    <p class="shop-sub">Personalizá a tu adorable cabrita</p>
    <div class="shop-grid">
      ${SHOP.map(it=>{
        if(it.consumable){
          const count = it.id==='shield' ? state.streakShields : 0;
          return `
          <div class="shop-item" onclick="buyItem('${it.id}')">
            <div class="shop-icon">${it.icon}</div>
            <div class="shop-name">${it.name}</div>
            ${count>0 ? `<div class="shop-owned-tag">Tenés ${count} — 🌿 ${it.price} por otro</div>` : `<div class="shop-price">🌿 ${it.price}</div>`}
          </div>`;
        }
        const owned = state.owned.includes(it.id);
        return `
        <div class="shop-item ${owned?'owned':''}" onclick="buyItem('${it.id}')">
          <div class="shop-icon">${it.icon}</div>
          <div class="shop-name">${it.name}</div>
          ${owned? `<div class="shop-owned-tag">${state.equipped.includes(it.id)?'✓ Equipado':'Comprado — tocar para equipar'}</div>` : `<div class="shop-price">🌿 ${it.price}</div>`}
        </div>`;
      }).join('')}
    </div>
    <p class="shop-sub" style="margin-top:18px; font-size:12px; line-height:16px;">🛡️ El Seguro de Racha protege automáticamente tu fuego si algún día no llegás a cumplir tus cumbres.</p>
  `;
  return {body, footer:''};
}
function buyItem(id){
  const it = SHOP.find(s=>s.id===id);
  if(it.consumable){
    if(state.coins < it.price){ toast('No te alcanzan los Brotes de Alfalfa 🌿'); return; }
    state.coins -= it.price;
    if(id==='shield') state.streakShields += 1;
    render();
    toast(`¡Compraste ${it.name}! 🛡️`);
    return;
  }
  if(state.owned.includes(id)){
    if(state.equipped.includes(id)) state.equipped = [];
    else state.equipped = [id];
    render();
    return;
  }
  if(state.coins < it.price){ toast('No te alcanzan los Brotes de Alfalfa 🌿'); return; }
  state.coins -= it.price;
  state.owned.push(id);
  state.equipped = [id];
  render();
  toast(`¡Compraste ${it.name}!`);
}
function unequipItem(id){
  state.equipped = state.equipped.filter(e=>e!==id);
  render();
}

/* ---------- Confeti ---------- */
function spawnConfetti(){
  const wrap = document.getElementById('confettiWrap');
  if(!wrap) return;
  const colors = ['#FF6F8E','#4A3AC9','#FCE7C8','#33C66D','#2A1F66'];
  for(let i=0;i<22;i++){
    const s = document.createElement('span');
    const angle = Math.random()*Math.PI*2;
    const dist = 70+Math.random()*70;
    s.style.background = colors[i%colors.length];
    s.style.setProperty('--x', Math.cos(angle)*dist+'px');
    s.style.setProperty('--y', Math.sin(angle)*dist+'px');
    s.style.animation = `confetti-burst ${0.7+Math.random()*0.5}s ease-out forwards`;
    s.style.animationDelay = (Math.random()*0.15)+'s';
    wrap.appendChild(s);
  }
}
const styleSheet = document.createElement('style');
styleSheet.textContent = `@keyframes confetti-burst{
  0%{ opacity:1; transform:translate(0,0) rotate(0deg); }
  100%{ opacity:0; transform:translate(var(--x),var(--y)) rotate(260deg); }
}`;
document.head.appendChild(styleSheet);

render();
if(state.loggedIn){
  const streakEvent = checkStreakRollover();
  if(streakEvent === 'shielded'){
    render();
    toast('Usamos tu Seguro de Racha para proteger tu fuego 🔥🛡️');
  } else if(streakEvent === 'lost'){
    render();
    toast('Se apagó la racha, pero tu cabrita ya está lista para volver a subir 🐐');
  }
}
</script>
</body>
</html>
